name: Android 14 virtual Bluetooth routing probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bluetooth-simulation.yml'
      - 'ci/bluetooth/**'
      - 'app/**'

permissions:
  contents: read

concurrency:
  group: virtual-bluetooth-${{ github.ref }}
  # Preserve ongoing radio tests when a follow-up fix is pushed.
  cancel-in-progress: false

jobs:
  virtual-a2dp:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Check out Google's virtual Bluetooth stack at a fixed revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: google/bumble
          ref: 34def7f112f970cf1cb46233b8b71d6af1ba9f81
          path: .ci-bumble
          persist-credentials: false
      - name: Install CI-only virtual speaker dependencies
        run: python -m pip install -e './.ci-bumble[android]'
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Pair a software A2DP sink and exercise native routing
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ci/bluetooth/run.sh
      - name: Upload software-radio test results and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: virtual-bluetooth-reports
          path: |
            app/build/bluetooth-logs/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 14
          if-no-files-found: ignore
