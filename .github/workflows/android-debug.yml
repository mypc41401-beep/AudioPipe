name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-debug.yml'
      - 'app/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew'
      - 'build.gradle'
      - 'settings.gradle'

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify debug APK
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Check out this fork
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrapper and cache dependencies
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Install Android SDK 34
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Build APK, run JVM tests and Android lint
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest :app:lintDebug

      - name: Verify APK signature and metadata
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload APK
        id: apk
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AudioPipe-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload unit test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14

      - name: Link APK and state test limits
        if: always() && steps.apk.outcome == 'success'
        env:
          APK_URL: ${{ steps.apk.outputs.artifact-url }}
        run: |
          {
            echo "## AudioPipe debug APK"
            echo "[Download APK ZIP]($APK_URL)"
            echo ""
            echo "Unzip the download and install app-debug.apk on Android."
            echo "The Android job also checks real adbd pairing and native UID policy registration and original-player observation. A second-device test can skip when the HAL has only one endpoint. It does not test Bluetooth, Xiaomi hardware, or acoustic isolation."
          } >> "$GITHUB_STEP_SUMMARY"

  android14-pairing:
    name: Android 14 ADB and native UID policy tests
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Download the exact APK delivered to the user
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: AudioPipe-debug
          path: delivered-apk
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify real adbd pairing and native UID audio policy
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          # A user image enables secure adbd; google_apis has ro.adb.secure=0
          # and closes the Wireless debugging Settings screen without pairing.
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            ./gradlew --no-daemon --stacktrace :app:connectedDebugAndroidTest
            adb uninstall com.asdfg.soundmaster.test
            adb uninstall com.asdfg.soundmaster
            adb install --no-streaming delivered-apk/app-debug.apk
            adb shell pm grant com.asdfg.soundmaster android.permission.POST_NOTIFICATIONS
            adb shell am start -W -n com.asdfg.soundmaster/.MainActivity
            mkdir -p app/build/runtime-logs
            adb shell dumpsys activity activities > app/build/runtime-logs/activities.txt
            adb shell dumpsys meminfo com.asdfg.soundmaster > app/build/runtime-logs/memory.txt
            adb logcat -b crash -d > app/build/runtime-logs/crashes.txt
            if grep -q 'Process: com.asdfg.soundmaster,' app/build/runtime-logs/crashes.txt; then cat app/build/runtime-logs/crashes.txt; exit 1; fi
      - name: Upload Android integration test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android14-pairing-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/runtime-logs/
          if-no-files-found: ignore
          retention-days: 14
