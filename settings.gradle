pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // Only the reviewed SPAKE2 implementation may resolve from JitPack.
        exclusiveContent {
            forRepository { maven { url 'https://jitpack.io' } }
            filter { includeGroup 'com.github.MuntashirAkon.spake2-java' }
        }
    }
}

rootProject.name = "AudioPipe"
include ':app'
