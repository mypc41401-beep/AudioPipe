plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Robolectric runs on a Linux JVM, so it needs Conscrypt's JVM native library.
// Keep the Android AAR (and its Android ABIs) in the production APK.
configurations.matching { it.name.contains('UnitTest') }.configureEach {
    resolutionStrategy.dependencySubstitution {
        substitute module('org.conscrypt:conscrypt-android') using module('org.conscrypt:conscrypt-openjdk-uber:2.9.0')
    }
}

android {
    namespace 'com.asdfg.soundmaster'
    compileSdk 34

    defaultConfig {
        applicationId "com.asdfg.soundmaster"
        minSdk 30
        targetSdk 34
        versionCode 3
        versionName "1.2-uid-routing-test"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        testInstrumentationRunnerArguments timeout_msec: '90000'

        // NDK disabled for now
        // ndk {
        //     abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        // }

        // externalNativeBuild {
        //     cmake {
        //         cppFlags '-std=c++17'
        //     }
        // }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    // Use the upstream Android SPAKE2 AAR; no local CMake/BoringSSL build is needed.
    // Bundled Conscrypt supplies a public TLS exporter without hidden Android APIs.
    // externalNativeBuild {
    //     cmake {
    //         path file("src/main/jni/CMakeLists.txt")
    //         version "3.22.1"
    //     }
    // }

    buildFeatures {
        viewBinding true
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.media:media:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    
    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    
    // BouncyCastle for RSA key generation
    implementation 'org.bouncycastle:bcprov-jdk18on:1.77'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.77'
    implementation 'com.github.MuntashirAkon.spake2-java:spake2-android:2.2.1'
    implementation 'org.conscrypt:conscrypt-android:2.9.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation 'androidx.test:core:1.5.0'
    testImplementation 'org.mockito:mockito-core:5.7.0'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:5.2.1'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.2.0'
}
